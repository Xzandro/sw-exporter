name: Linting
on: pull_request
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Node.js dependencies
        run: npm install

      - name: Run simple linters for PRs
        run: npm run lint
