name: Build Mac
on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - run: npm run build
      - run: npm run dist
      - name: Set artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          path: |
            ./dist/*.dmg
            ./dist/*.yml
